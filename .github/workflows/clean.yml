name: "Wiki HTML Minimal Render"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          rm -rf docs/wiki_encyclopedia
          mkdir -p docs/wiki_encyclopedia

      - name: Clone Wiki
        run: git clone --depth=1 https://github.com/MrAnonymousNWO/One_World.wiki.git wiki_temp

      - name: Install Pandoc
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc

      - name: Convert Wiki pages to HTML
        run: |
          mkdir -p docs/wiki_encyclopedia
          exts="md mediawiki rst org txt"
          for ext in $exts; do
            while IFS= read -r file; do
              [ -e "$file" ] || continue
              rel="${file#wiki_temp/}"
              base="${rel%.$ext}"
              out="docs/wiki_encyclopedia/${base}.html"
              mkdir -p "$(dirname "$out")"
              case "$ext" in
                md)        pandoc "$file" -f markdown  -t html -o "$out" ;;
                mediawiki) pandoc "$file" -f mediawiki -t html -o "$out" ;;
                rst)       pandoc "$file" -f rst       -t html -o "$out" ;;
                org)       pandoc "$file" -f org       -t html -o "$out" ;;
                txt)       pandoc "$file" -f markdown  -t html -o "$out" ;;
              esac
            done < <(find wiki_temp -type f -name "*.$ext")
          done

      - name: Remove wiki clone
        run: rm -rf wiki_temp

      - name: Commit and push generated HTML
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add docs/wiki_encyclopedia || true
          git commit -m "Rendered wiki HTML (recursive)" || echo "No changes"
          git push
