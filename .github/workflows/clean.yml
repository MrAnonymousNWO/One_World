name: "Wiki HTML Minimal Render"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: |
          rm -rf docs/wiki_encyclopedia
          mkdir -p docs/wiki_encyclopedia

      - name: Clone Wiki
        run: git clone --depth=1 https://github.com/MrAnonymousNWO/One_World.wiki.git wiki_temp

      - name: Install Pandoc
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc

      - name: Convert Markdown to HTML
        run: |
          for file in wiki_temp/*.md; do
            [ -e "$file" ] || continue
            base="${file##*/}"
            base="${base%.md}"
            pandoc "$file" -f markdown -t html -o "docs/wiki_encyclopedia/${base}.html"
          done

      - name: Remove wiki clone
        run: rm -rf wiki_temp

      - name: Commit and push generated HTML
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add docs/wiki_encyclopedia || true
          git commit -m "Rendered wiki HTML (minimal)" || echo "No changes"
          git push
