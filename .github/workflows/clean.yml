name: "Wiki Indexing Clean"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Wiki
        run: git clone --depth=1 https://github.com/MrAnonymousNWO/One_World.wiki.git wiki_temp

      - name: Install converters
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc asciidoctor

      - name: Run conversion script
        run: bash scripts/wiki_convert.sh

      - name: Cleanup
        run: rm -rf wiki_temp

      - name: Commit and push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add docs
          git commit -m "Clean wiki indexing" || echo "No changes"
          git push
