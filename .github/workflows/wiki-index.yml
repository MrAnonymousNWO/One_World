name: "Full Indexing: Render ALL Wiki Formats"

on:
  push:
    branches: ["master"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ensure .nojekyll exists
        run: echo "" > docs/.nojekyll

      - name: Prepare wiki output directory
        run: |
          rm -rf docs/wiki_encyclopedia
          mkdir -p docs/wiki_encyclopedia

      - name: Clone Wiki temporarily
        run: git clone --depth=1 https://github.com/MrAnonymousNWO/One_World.wiki.git wiki_temp

      - name: Install converters (Pandoc + Asciidoctor)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc asciidoctor

      - name: Run wiki conversion script
        run: bash scripts/wiki_convert.sh

      - name: Cleanup temporary wiki
        run: rm -rf wiki_temp

      - name: Generate directory listing using template
        run: bash scripts/generate_directory.sh

      - name: Generate dir-sitemap.xml
        run: bash scripts/generate_sitemap.sh

      - name: Commit and push generated files
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add docs
          git commit -m "Automated full wiki indexing (One_World)" || echo "No changes to commit"
          git push
