name: "One World – Full Wiki Render to docs/"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare docs output directory
        run: |
          rm -rf docs
          mkdir -p docs

      - name: Clone One_World Wiki
        run: git clone --depth=1 https://github.com/MrAnonymousNWO/One_World.wiki.git wiki_temp

      - name: Install converters
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc asciidoctor

      - name: Convert ALL wiki formats to HTML (FLAT STRUCTURE → docs/)
        run: |
          TEMPLATE="docs/wiki_encyclopedia.html"
          EXT="md mediawiki creole org rst textile pod rdoc txt adoc"

          for ext in $EXT; do
            shopt -s nullglob
            for file in wiki_temp/*.$ext; do
              base="${file##*/}"
              base="${base%.$ext}"
              out="docs/${base}.html"

              case "$ext" in
                adoc) asciidoctor -o temp.html "$file" ;;
                md) pandoc "$file" -f markdown -t html -o temp.html ;;
                mediawiki) pandoc "$file" -f mediawiki -t html -o temp.html ;;
                creole) pandoc "$file" -f creole -t html -o temp.html ;;
                org) pandoc "$file" -f org -t html -o temp.html ;;
                rst) pandoc "$file" -f rst -t html -o temp.html ;;
                textile) pandoc "$file" -f textile -t html -o temp.html ;;
                pod) pandoc "$file" -f pod -t html -o temp.html ;;
                rdoc) pandoc "$file" -f rdoc -t html -o temp.html ;;
                txt) pandoc "$file" -f markdown -t html -o temp.html ;;
              esac

              awk -v content="$(cat temp.html)" '
                /<!-- WORKFLOW WILL INSERT WIKI ARTICLE CONTENT HERE -->/ {
                  print content
                  next
                }
                { print }
              ' "$TEMPLATE" > "$out"
            done
            shopt -u nullglob
          done

      - name: Cleanup
        run: rm -rf wiki_temp temp.html

      - name: Commit and push rendered docs
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add docs || true
          git commit -m "Rendered One_World Wiki to docs/" || echo "No changes"
          git push
