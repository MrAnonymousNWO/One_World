<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One United World Encyclopedia</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Electric Technocracy Encyclopedia – dynamic index and viewer for all One World wiki articles.">
<meta name="keywords" content="Electric Technocracy, Encyclopedia, One World, Wiki, Governance, Technocracy, Knowledge">
<meta name="author" content="Electric Technocracy Pioneers Community">

<!-- Markdown Renderer -->
<script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>

<style>
/* GLOBAL */
body { margin:0; font-family:Georgia,serif; background:#f5f5f5; color:#222; display:flex; }

/* SIDEBAR */
#sidebar { width:260px; background:#111; color:#fff; height:100vh; overflow-y:auto; position:fixed; left:0; top:0; padding:20px; box-sizing:border-box; }
#sidebar h2 { margin-top:0; }
#sidebar a { display:block; color:#fff; text-decoration:none; padding:6px 0; opacity:0.85; }
#sidebar a:hover { opacity:1; }

/* SEARCH */
#searchBox { width:100%; padding:8px; margin:10px 0 20px 0; border-radius:6px; border:none; }
.search-result { margin-bottom:15px; }
.search-result a { color:#fff; font-weight:bold; }
.search-snippet { font-size:0.8rem; opacity:0.7; }

/* MOBILE */
#mobile-toggle { display:none; position:fixed; top:15px; left:15px; background:#111; color:#fff; padding:10px 14px; border-radius:6px; cursor:pointer; z-index:999; }
@media(max-width:900px){
    #sidebar{transform:translateX(-100%);transition:0.3s;}
    #sidebar.open{transform:translateX(0);}
    #mobile-toggle{display:block;}
}

/* CONTENT */
#content { margin-left:260px; padding:30px; max-width:900px; }
@media(max-width:900px){ #content{margin-left:0;padding:20px;} }

/* HEADER */
header { background:#0f0f0f; color:#fff; padding:25px; border-radius:10px; }
header h1 { margin:0; }

/* ARTICLE */
article { background:#fff; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.05); margin-top:25px; }

/* BREADCRUMB */
#breadcrumb { margin:15px 0; font-size:0.9rem; }
#breadcrumb a { color:#333; text-decoration:none; }
#breadcrumb a:hover { text-decoration:underline; }

/* FOOTER */
footer { margin-top:40px; padding:20px; background:#0f0f0f; color:#fff; text-align:center; border-radius:10px; }
</style>

<script>
function toggleSidebar(){ document.getElementById("sidebar").classList.toggle("open"); }

document.addEventListener("DOMContentLoaded", () => {
    const sidebar = document.getElementById("sidebar-links");
    const searchBox = document.getElementById("searchBox");

    const api = "https://api.github.com/repos/MrAnonymousNWO/One_World/contents/docs/wiki_encyclopedia";

    let articleIndex = {}; // { name: { text: "...", label: "..." } }

    fetch(api)
        .then(r => r.json())
        .then(files => {
            const mdFiles = files.filter(f => f.name.endsWith(".md"));
            mdFiles.sort((a,b)=>a.name.localeCompare(b.name));

            // Sidebar list
            mdFiles.forEach(f => {
                const base = f.name.replace(".md","");
                const label = base.replace(/_/g," ");

                const link = document.createElement("a");
                link.href = "?article=" + base;
                link.textContent = label;
                link.dataset.label = label.toLowerCase();

                sidebar.appendChild(link);

                // Preload raw text for search
                fetch(f.download_url)
                    .then(r => r.text())
                    .then(text => {
                        articleIndex[base] = {
                            label: label,
                            text: text
                        };
                    });
            });

            // Search filter
            searchBox.addEventListener("input", () => {
                const q = searchBox.value.toLowerCase();
                sidebar.innerHTML = "";

                if(q.length === 0){
                    // restore normal list
                    mdFiles.forEach(f => {
                        const base = f.name.replace(".md","");
                        const label = base.replace(/_/g," ");
                        const link = document.createElement("a");
                        link.href = "?article=" + base;
                        link.textContent = label;
                        sidebar.appendChild(link);
                    });
                    return;
                }

                // Fulltext search
                Object.keys(articleIndex).forEach(key => {
                    const entry = articleIndex[key];
                    const text = entry.text.toLowerCase();

                    if(text.includes(q)){
                        const pos = text.indexOf(q);
                        const snippet = entry.text.substring(Math.max(0,pos-40), pos+40);

                        const div = document.createElement("div");
                        div.className = "search-result";

                        div.innerHTML = `
                            <a href="?article=${key}">${entry.label}</a>
                            <div class="search-snippet">${snippet.replace(/\n/g," ")}</div>
                        `;

                        sidebar.appendChild(div);
                    }
                });
            });

            // Load article from URL
            const params = new URLSearchParams(window.location.search);
            const article = params.get("article") || "Home";
            loadArticle(article);
        });
});

// Load and render Markdown
function loadArticle(name){
    const article = document.querySelector("article");
    const breadcrumb = document.getElementById("breadcrumb");

    const url = `https://raw.githubusercontent.com/MrAnonymousNWO/One_World/main/docs/wiki_encyclopedia/${name}.md`;

    fetch(url)
        .then(r => r.text())
        .then(md => {
            const converter = new showdown.Converter({
                tables:true, ghCompatibleHeaderId:true,
                simplifiedAutoLink:true, strikethrough:true, tasklists:true
            });

            const html = converter.makeHtml(md);
            article.innerHTML = html;

            // Extract first H1 as title
            const temp = document.createElement("div");
            temp.innerHTML = html;
            const h1 = temp.querySelector("h1");
            document.title = h1 ? h1.textContent : name;

            // Breadcrumb
            breadcrumb.innerHTML = `
                <a href="encyclopedia.html">Encyclopedia</a> › 
                <span>${h1 ? h1.textContent : name}</span>
            `;
        })
        .catch(() => {
            article.innerHTML = "<p style='color:red'>Article not found.</p>";
        });
}
</script>

</head>
<body>

<div id="mobile-toggle" onclick="toggleSidebar()">☰ Menu</div>

<!-- SIDEBAR -->
<div id="sidebar">
    <h2>📚 Articles</h2>
    <input id="searchBox" type="text" placeholder="Search…">
    <div id="sidebar-links"></div>
</div>

<!-- CONTENT -->
<div id="content">

<header>
    <h1>Electric Technocracy Encyclopedia</h1>
    <p>Dynamic viewer for all One World wiki articles</p>
</header>

<div id="breadcrumb"></div>

<article>Loading…</article>

<footer>
    Electric Technocracy Pioneers Community — Open Knowledge for Global Accessibility
</footer>

</div>
</body>
</html>
